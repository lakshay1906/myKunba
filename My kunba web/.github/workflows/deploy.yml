name: Deploy Next.js to Amazon Linux EC2

on:
  push:
    branches: [main]

env:
  # App path: use "." if repo root is the app; use "My kunba web" if app is in that subfolder
  APP_PATH: "."

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout repository
      - name: Checkout code
        uses: actions/checkout@v4

      # 2️⃣ Build Docker image
      - name: Build Docker image
        run: docker build -t mykunba:latest "${{ env.APP_PATH }}"

      # 3️⃣ Save Docker image as tar
      - name: Save Docker image
        run: docker save mykunba:latest -o mykunba.tar

      # 4️⃣ Copy image tar to EC2
      - name: Copy image to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "mykunba.tar"
          target: "/home/ec2-user"

      # 5️⃣ Load image & run container on EC2
      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            echo "Loading Docker image..."
            docker load -i /home/ec2-user/mykunba.tar

            echo "Stopping old container (if any)..."
            docker stop mykunba 2>/dev/null || true
            docker rm mykunba 2>/dev/null || true

            echo "Cleaning unused images..."
            docker image prune -f

            ENV_FILE="/home/ec2-user/.env"
            if [ ! -f "$ENV_FILE" ]; then
              echo "Warning: $ENV_FILE not found. Container may fail without env vars."
            fi

            echo "Starting new container..."
            docker run -d \
              --name mykunba \
              --restart unless-stopped \
              --env-file "$ENV_FILE" \
              -p 3000:3000 \
              mykunba:latest

            echo "Verifying container is running..."
            docker ps --filter name=mykunba --format "{{.Status}}"

            echo "Cleaning up tar file..."
            rm -f /home/ec2-user/mykunba.tar

            echo "Deployment completed successfully."
