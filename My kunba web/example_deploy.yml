name: Deploy Next.js to Amazon Linux EC2

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout repository
      - name: Checkout code
        uses: actions/checkout@v4

      # 2️⃣ Build Docker image from subfolder
      - name: Build Docker image
        run: |
          docker build \
            --build-arg CLOUDFLARE_HOSTNAME=${{ secrets.CLOUDFLARE_HOSTNAME }} \
            -t mykunba:latest "./My kunba web"

      # 3️⃣ Save Docker image as tar at repo root
      - name: Save Docker image
        run: docker save mykunba:latest > mykunba.tar

      # 4️⃣ Copy image tar to EC2
      - name: Copy image to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          source: mykunba.tar
          target: /home/ec2-user

      # 5️⃣ Load image & run container on EC2
      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            echo "Loading Docker image..."
            docker load < /home/ec2-user/mykunba.tar

            echo "Stopping old container (if any)..."
            docker stop mykunba || true
            docker rm mykunba || true

            echo "Cleaning unused images..."
            docker image prune -f

            echo "Starting new container..."
            docker run -d \
              --name mykunba \
              --restart unless-stopped \
              --env-file /home/ec2-user/.env \
              -p 3000:3000 \
              mykunba:latest

            echo "Waiting for app to be ready..."
            sleep 15

            echo "Running i18n migrations (idempotent)..."
            docker exec mykunba node scripts/run-migration.js

            echo "Cleaning up tar file..."
            rm -f /home/ec2-user/mykunba.tar

            echo "Deployment completed successfully."
