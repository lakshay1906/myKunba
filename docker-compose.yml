version: "3.9"

services:
  my-kunba-web:
    image: mykunba:latest  # Updated to match your deploy.yml image name
    restart: unless-stopped
    env_file:
      - ${KUNBA_ENV_FILE:-./My kunba web/.env}
    environment:
      GOOGLE_APPLICATION_CREDENTIALS: /app/service-account.json
      # This allows the app to know which port it is actually using internally
      NEXT_PUBLIC_NEXT_URL: ${NEXT_PUBLIC_NEXT_URL} 
    volumes:
      - ${GOOGLE_CREDS_PATH:-/home/ec2-user/mykunba/secrets/service-account.json}:/app/service-account.json:ro
    ports:
      # DYNAMIC PORT: This uses the APP_PORT variable or defaults to 3000
      - "${APP_PORT:-3000}:3000"
    networks:
      - kunba-network

  mykunba-automation:
    image: mykunba-automation:latest
    restart: "no"
    environment:
      # Use the internal Docker network name so automation always finds the web service
      # regardless of the external port (3000 or 3001)
      MY_KUNBA_WEB_URL: http://my-kunba-web:3000
      GOOGLE_APPLICATION_CREDENTIALS: /app/service-account.json
    volumes:
      - ${GOOGLE_CREDS_PATH:-/home/ec2-user/mykunba/secrets/service-account.json}:/app/service-account.json:ro
    networks:
      - kunba-network

networks:
  kunba-network:
    driver: bridge