name: Deploy Next.js to Amazon Linux EC2

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout repository
      - name: Checkout code
        uses: actions/checkout@v4

      # 2️⃣ Build web Docker image (WITH BUILD ARGS)
      - name: Build web Docker image
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_NEXT_URL=${{ secrets.NEXT_PUBLIC_NEXT_URL }} \
            --build-arg NEXT_PUBLIC_PUBLIC_URL=${{ secrets.NEXT_PUBLIC_PUBLIC_URL }} \
            --build-arg NEXT_PUBLIC_ADSENSE_ID=${{ secrets.NEXT_PUBLIC_ADSENSE_ID }} \
            --build-arg NEXT_PUBLIC_ADS_SLOT_1=${{ secrets.NEXT_PUBLIC_ADS_SLOT_1 }} \
            --build-arg NEXT_PUBLIC_ADS_SLOT_2=${{ secrets.NEXT_PUBLIC_ADS_SLOT_2 }} \
            --build-arg NEXT_PUBLIC_ADS_SLOT_3=${{ secrets.NEXT_PUBLIC_ADS_SLOT_3 }} \
            --build-arg NEXT_PUBLIC_ADS_SLOT_4=${{ secrets.NEXT_PUBLIC_ADS_SLOT_4 }} \
            --build-arg NEXT_PUBLIC_ADS_SLOT_IN_FEED=${{ secrets.NEXT_PUBLIC_ADS_SLOT_IN_FEED }} \
            --build-arg NEXT_PUBLIC_ADS_SLOT_BELOW_TITLE=${{ secrets.NEXT_PUBLIC_ADS_SLOT_BELOW_TITLE }} \
            --build-arg NEXT_PUBLIC_ADS_SLOT_IN_ARTICLE=${{ secrets.NEXT_PUBLIC_ADS_SLOT_IN_ARTICLE }} \
            --build-arg NEXT_PUBLIC_ADS_SLOT_LEFT_SIDEBAR=${{ secrets.NEXT_PUBLIC_ADS_SLOT_LEFT_SIDEBAR }} \
            --build-arg NEXT_PUBLIC_ADS_DISPLAY_HORIZONTAL=${{ secrets.NEXT_PUBLIC_ADS_DISPLAY_HORIZONTAL }} \
            --build-arg NEXT_PUBLIC_ADS_MULTIPLEX_SLOT=${{ secrets.NEXT_PUBLIC_ADS_MULTIPLEX_SLOT }} \
            --build-arg NEXT_PUBLIC_ADS_MULTIPLEX_SLOT_HORIZONTAL=${{ secrets.NEXT_PUBLIC_ADS_MULTIPLEX_SLOT_HORIZONTAL }} \
            --build-arg NEXT_PUBLIC_GA_PROPERTY_ID=${{ secrets.NEXT_PUBLIC_GA_PROPERTY_ID }} \
            --build-arg CLOUDFLARE_HOSTNAME=${{ secrets.CLOUDFLARE_HOSTNAME }} \
            --build-arg CLOUDFLARE_API_TOKEN=${{ secrets.CLOUDFLARE_API_TOKEN }} \
            --build-arg CLOUDFLARE_ZONE_ID=${{ secrets.CLOUDFLARE_ZONE_ID }} \
            --build-arg PAYLOAD_SECRET=${{ secrets.PAYLOAD_SECRET }} \
            -t mykunba-web:latest "./My kunba web"

      # 3️⃣ Build automation Docker image
      - name: Build automation Docker image
        run: docker build -t mykunba-automation:latest "./mykunba-automation"

      # 4️⃣ Save Docker images
      - name: Save Docker images
        run: |
          docker save mykunba-web:latest > mykunba-web.tar
          docker save mykunba-automation:latest > mykunba-automation.tar

      # 5️⃣ Create Google credentials file
      - name: Create Google credentials file
        run: |
          echo '${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}' > google_creds.json

      # 6️⃣ Copy images + root production compose to EC2
      - name: Copy images and compose file to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "mykunba-web.tar,mykunba-automation.tar,docker-compose.yml,google_creds.json"
          target: /home/ec2-user

      # 7️⃣ Deploy (using root /home/ec2-user/mykunba/docker-compose.yml)
      # 7️⃣ Deploy (with explicit cleanup to free port 3000)
      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            mkdir -p /home/ec2-user/mykunba/secrets
            mkdir -p /home/ec2-user/mykunba

            if [ -f /home/ec2-user/docker-compose.yml ]; then
              mv /home/ec2-user/docker-compose.yml /home/ec2-user/mykunba/docker-compose.yml
            fi

            if [ -f /home/ec2-user/google_creds.json ]; then
              mv /home/ec2-user/google_creds.json /home/ec2-user/mykunba/secrets/service-account.json
              chmod 600 /home/ec2-user/mykunba/secrets/service-account.json
            fi

            echo "Loading Docker images..."
            docker load < /home/ec2-user/mykunba-web.tar
            docker load < /home/ec2-user/mykunba-automation.tar

            echo "Force-stopping existing containers on port 3000..."
            # This stops and removes ANY container using port 3000 to prevent 'port already allocated' errors
            docker ps -q --filter "publish=3000" | xargs -r docker stop
            docker ps -aq --filter "publish=3000" | xargs -r docker rm

            echo "Cleaning unused images..."
            docker image prune -f

            echo "Updating web service with docker compose..."
            KUNBA_ENV_FILE=/home/ec2-user/.env \
            GOOGLE_CREDS_PATH=/home/ec2-user/mykunba/secrets/service-account.json \
            docker compose -f /home/ec2-user/mykunba/docker-compose.yml up -d --force-recreate --remove-orphans my-kunba-web

            sleep 15

            echo "Running SQL migrations..."
            docker compose -f /home/ec2-user/mykunba/docker-compose.yml exec -T my-kunba-web node scripts/run-migration.js
            docker compose -f /home/ec2-user/mykunba/docker-compose.yml exec -T my-kunba-web node scripts/submit-blog-urls-to-google.js || true

            rm -f /home/ec2-user/mykunba-web.tar /home/ec2-user/mykunba-automation.tar

            echo "Deployment completed successfully."

      # 8️⃣ Purge Cloudflare Cache
      - name: Purge Cloudflare Cache
        run: |
          curl -X POST "https://api.cloudflare.com/client/v4/zones/${{ secrets.CLOUDFLARE_ZONE_ID }}/purge_cache" \
          -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
          -H "Content-Type: application/json" \
          --data '{"purge_everything":true}'
