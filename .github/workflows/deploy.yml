name: Deploy Next.js to Amazon Linux EC2

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout repository
      - name: Checkout code
        uses: actions/checkout@v4

      # 2️⃣ Build Docker image from subfolder
      - name: Build Docker image
        run: docker build -t mykunba:latest "./My kunba web"

      # 3️⃣ Save Docker image as tar at repo root
      - name: Save Docker image
        run: docker save mykunba:latest > mykunba.tar

      # 4️⃣ Prepare Google credentials (base64) so they can be written safely on EC2
      - name: Prepare Google credentials
        id: prepare-google
        env:
          GOOGLE_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          echo "$GOOGLE_JSON" > _google_json.txt
          # Delimiter must not appear in base64 (base64 uses only A-Za-z0-9+/=); hyphen is safe
          echo "b64<<---END-B64---" >> $GITHUB_OUTPUT
          base64 -w0 _google_json.txt >> $GITHUB_OUTPUT
          echo "---END-B64---" >> $GITHUB_OUTPUT
          rm -f _google_json.txt

      # 5️⃣ Copy image tar to EC2
      - name: Copy image to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          source: mykunba.tar
          target: /home/ec2-user

      # 6️⃣ Load image, Setup Secrets & run container on EC2
      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1.0.3
        env:
          GOOGLE_JSON_B64: ${{ steps.prepare-google.outputs.b64 }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: GOOGLE_JSON_B64
          script: |
            set -e

            # Create secrets directory if it doesn't exist
            mkdir -p /home/ec2-user/mykunba/secrets

            # Write the Google JSON secret from base64 (avoids corruption from special chars/newlines)
            echo "$GOOGLE_JSON_B64" | base64 -d > /home/ec2-user/mykunba/secrets/service-account.json
            chmod 600 /home/ec2-user/mykunba/secrets/service-account.json

            echo "Loading Docker image..."
            docker load < /home/ec2-user/mykunba.tar

            echo "Stopping old container (if any)..."
            docker stop mykunba || true
            docker rm mykunba || true

            echo "Cleaning unused images..."
            docker image prune -f

            echo "Starting new container with Google Credentials mounted..."
            docker run -d \
              --name mykunba \
              --restart unless-stopped \
              --env-file /home/ec2-user/.env \
              -e GOOGLE_APPLICATION_CREDENTIALS=/app/service-account.json \
              -v /home/ec2-user/mykunba/secrets/service-account.json:/app/service-account.json:ro \
              -p 3000:3000 \
              mykunba:latest

            echo "Waiting for app to be ready..."
            sleep 15

            echo "Running i18n migrations (idempotent)..."
            docker exec mykunba node scripts/run-migration.js || true

            # Trigger the bulk indexing for existing 40 blogs (idempotent)
            echo "Submitting existing URLs to Google Indexing API..."
            docker exec mykunba node scripts/submit-blog-urls-to-google.js || true

            echo "Cleaning up tar file..."
            rm -f /home/ec2-user/mykunba.tar

            echo "Deployment completed successfully."
