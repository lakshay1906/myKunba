name: Deploy Next.js to Amazon Linux EC2

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout repository
      - name: Checkout code
        uses: actions/checkout@v4

      # 2️⃣ Build Docker image from subfolder
      - name: Build Docker image
        run: docker build -t mykunba:latest "./My kunba web"

      # 3️⃣ Save Docker image as tar at repo root
      - name: Save Docker image
        run: docker save mykunba:latest > mykunba.tar

      # 4️⃣ Create the credentials file (Directly avoids delimiter issues)
      - name: Create Google credentials file
        run: |
          echo '${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}' > google_creds.json

      # 5️⃣ Copy image tar to EC2
      - name: Copy image to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          source: mykunba.tar
          target: /home/ec2-user

      # 5b Copy Google credentials file to EC2
      - name: Copy Google credentials to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          source: google_creds.json
          target: /home/ec2-user

      # 6️⃣ Load image, Setup Secrets & run container on EC2
      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            # Setup directory and move the secret file
            mkdir -p /home/ec2-user/mykunba/secrets
            if [ -f /home/ec2-user/google_creds.json ]; then
              mv /home/ec2-user/google_creds.json /home/ec2-user/mykunba/secrets/service-account.json
              chmod 600 /home/ec2-user/mykunba/secrets/service-account.json
            fi

            echo "Loading Docker image..."
            docker load < /home/ec2-user/mykunba.tar

            echo "Stopping old container (if any)..."
            docker stop mykunba || true
            docker rm mykunba || true

            echo "Cleaning unused images..."
            docker image prune -f

            echo "Starting new container with Google Credentials mounted..."
            docker run -d \
              --name mykunba \
              --restart unless-stopped \
              --env-file /home/ec2-user/.env \
              -e GOOGLE_APPLICATION_CREDENTIALS=/app/service-account.json \
              -v /home/ec2-user/mykunba/secrets/service-account.json:/app/service-account.json:ro \
              -p 3000:3000 \
              mykunba:latest

            echo "Waiting for app to be ready..."
            sleep 15

            echo "Running i18n migrations..."
            docker exec mykunba node scripts/run-migration.js || true

            # Trigger the 2026 Strategy: Bulk Indexing for 40 existing blogs
            echo "Submitting URLs to Google Indexing API..."
            docker exec mykunba node scripts/submit-blog-urls-to-google.js || true

            echo "Cleaning up tar file..."
            rm -f /home/ec2-user/mykunba.tar

            echo "Deployment completed successfully."
