name: Deploy Next.js to Amazon Linux EC2

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout repository
      - name: Checkout code
        uses: actions/checkout@v4

      # 2️⃣ Build Docker image (WITH BUILD ARGS)
      - name: Build Docker image
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_NEXT_URL=${{ secrets.NEXT_PUBLIC_NEXT_URL }} \
            --build-arg NEXT_PUBLIC_PUBLIC_URL=${{ secrets.NEXT_PUBLIC_PUBLIC_URL }} \
            --build-arg NEXT_PUBLIC_ADSENSE_ID=${{ secrets.NEXT_PUBLIC_ADSENSE_ID }} \
            --build-arg NEXT_PUBLIC_ADS_SLOT_1=${{ secrets.NEXT_PUBLIC_ADS_SLOT_1 }} \
            --build-arg NEXT_PUBLIC_ADS_SLOT_2=${{ secrets.NEXT_PUBLIC_ADS_SLOT_2 }} \
            --build-arg NEXT_PUBLIC_ADS_SLOT_3=${{ secrets.NEXT_PUBLIC_ADS_SLOT_3 }} \
            --build-arg NEXT_PUBLIC_ADS_SLOT_4=${{ secrets.NEXT_PUBLIC_ADS_SLOT_4 }} \
            --build-arg NEXT_PUBLIC_ADS_SLOT_IN_FEED=${{ secrets.NEXT_PUBLIC_ADS_SLOT_IN_FEED }} \
            --build-arg NEXT_PUBLIC_ADS_SLOT_BELOW_TITLE=${{ secrets.NEXT_PUBLIC_ADS_SLOT_BELOW_TITLE }} \
            --build-arg NEXT_PUBLIC_ADS_SLOT_IN_ARTICLE=${{ secrets.NEXT_PUBLIC_ADS_SLOT_IN_ARTICLE }} \
            --build-arg NEXT_PUBLIC_ADS_SLOT_LEFT_SIDEBAR=${{ secrets.NEXT_PUBLIC_ADS_SLOT_LEFT_SIDEBAR }} \
            --build-arg NEXT_PUBLIC_ADS_DISPLAY_HORIZONTAL=${{ secrets.NEXT_PUBLIC_ADS_DISPLAY_HORIZONTAL }} \
            --build-arg NEXT_PUBLIC_ADS_MULTIPLEX_SLOT=${{ secrets.NEXT_PUBLIC_ADS_MULTIPLEX_SLOT }} \
            --build-arg NEXT_PUBLIC_ADS_MULTIPLEX_SLOT_HORIZONTAL=${{ secrets.NEXT_PUBLIC_ADS_MULTIPLEX_SLOT_HORIZONTAL }} \
            --build-arg NEXT_PUBLIC_GA_PROPERTY_ID=${{ secrets.NEXT_PUBLIC_GA_PROPERTY_ID }} \
            --build-arg CLOUDFLARE_HOSTNAME=${{ secrets.CLOUDFLARE_HOSTNAME }} \
            --build-arg CLOUDFLARE_API_TOKEN=${{ secrets.CLOUDFLARE_API_TOKEN }} \
            --build-arg CLOUDFLARE_ZONE_ID=${{ secrets.CLOUDFLARE_ZONE_ID }} \
            --build-arg PAYLOAD_SECRET=${{ secrets.PAYLOAD_SECRET }} \
            -t mykunba:latest "./My kunba web"

      # 3️⃣ Save Docker image
      - name: Save Docker image
        run: docker save mykunba:latest > mykunba.tar

      # 4️⃣ Create Google credentials file
      - name: Create Google credentials file
        run: |
          echo '${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}' > google_creds.json

      # 5️⃣ Copy image to EC2
      - name: Copy image to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          source: mykunba.tar
          target: /home/ec2-user

      # 5b Copy Google credentials
      - name: Copy Google credentials to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          source: google_creds.json
          target: /home/ec2-user

      # 7️⃣ Zero-Downtime Deployment
      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            # 1. Check current active port in Nginx config
            if grep -q "127.0.0.1:3000" /etc/nginx/conf.d/mykunba.org.conf; then
              ACTIVE_PORT=3000
              TARGET_PORT=3001
              TARGET_NAME="mykunba-green"
              OLD_NAME="mykunba-blue"
            else
              ACTIVE_PORT=3001
              TARGET_PORT=3000
              TARGET_NAME="mykunba-blue"
              OLD_NAME="mykunba-green"
            fi

            echo "Current active port is $ACTIVE_PORT. Deploying new version to $TARGET_PORT..."

            # 2. Setup secrets
            mkdir -p /home/ec2-user/mykunba/secrets
            if [ -f /home/ec2-user/google_creds.json ]; then
              mv /home/ec2-user/google_creds.json /home/ec2-user/mykunba/secrets/service-account.json
              chmod 600 /home/ec2-user/mykunba/secrets/service-account.json
            fi

            # 3. Load and Start NEW container
            echo "Loading new image..."
            docker load < /home/ec2-user/mykunba.tar
            
            echo "Stopping any existing container named $TARGET_NAME..."
            docker stop $TARGET_NAME || true
            docker rm $TARGET_NAME || true

            echo "Starting new container $TARGET_NAME on port $TARGET_PORT..."
            docker run -d \
              --name $TARGET_NAME \
              --restart unless-stopped \
              --env-file /home/ec2-user/.env \
              -v /home/ec2-user/mykunba/secrets/service-account.json:/app/service-account.json:ro \
              -p $TARGET_PORT:3000 \
              mykunba:latest

            # 4. Wait for Next.js to boot (Health Check)
            echo "Checking health of new container..."
            HEALTHY=false
            for i in {1..12}; do
              if curl -s http://localhost:$TARGET_PORT > /dev/null; then
                echo "Health check passed!"
                HEALTHY=true
                break
              fi
              echo "Waiting for app to start... (Attempt $i)"
              sleep 5
            done

            if [ "$HEALTHY" = false ]; then
              echo "Deployment failed: New container did not start in time."
              docker logs $TARGET_NAME | tail -n 20
              exit 1
            fi

            # 5. Swap Nginx Traffic
            echo "Swapping Nginx to port $TARGET_PORT..."
            sudo sed -i "s/server 127.0.0.1:.*/server 127.0.0.1:$TARGET_PORT;/" /etc/nginx/conf.d/mykunba.org.conf
            sudo nginx -s reload

            # 6. Remove old container and tar file
            echo "Cleaning up old version..."
            docker stop $OLD_NAME || true
            docker rm $OLD_NAME || true
            rm -f /home/ec2-user/mykunba.tar
            docker image prune -f

            echo "ZERO-DOWNTIME DEPLOYMENT SUCCESSFUL."